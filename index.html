<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groove Quip</title>
<link rel="stylesheet" href="css/app.css"></head><body>
<div class="r app-header"><div class="app-brand"><b><span>GROOVE</span> <span class="app-brand-accent">QUIP</span></b><a class="app-about" href="about/">About</a></div></div>
<div class="r" id="tabs"></div>
<div class="r"><input id="ti" placeholder="Title"><input id="au" placeholder="Author"></div>
<div id="sc"></div>
<div id="g"></div>
<div class="r" id="pal"></div>
<div class="r" id="tl"></div>
<div class="r"><button data-x="add">+ Measure</button><button data-x="del">− Measure</button><button data-x="prev">‹ Prev</button><button data-x="next">Next ›</button><button data-x="undo">Undo</button><button data-x="clr">Clear</button></div>
<div class="r"><button data-x="png">PNG</button><button data-x="pdf">PDF</button><button data-x="save">Save file</button><button data-x="open">Open file</button><input id="f" type="file" accept=".json" hidden></div>
<div id="h"></div>
<div class="r footer-actions">
  <button id="themeToggle" class="action-link" type="button" aria-label="Toggle theme">Light mode</button>
  <a class="action-link" href="https://github.com/VandroiyLabs/groove-quip/issues/new?template=bug_report.md" target="_blank" rel="noreferrer">Bug Report</a>
  <a class="action-link" href="https://github.com/VandroiyLabs/groove-quip/issues/new?template=feature_request.md" target="_blank" rel="noreferrer">Feature Request</a>
</div>
<footer class="site-footer">
  Created by a developer for the love of music. Use it as you wish. If you want to support the project financially, donate to a charity — seriously. If you still want to help in any way, please visit <a href="https://github.com/VandroiyLabs/groove-quip" target="_blank" rel="noreferrer">our GitHub repo</a> and give it a star.
</footer>
<script>
  (function () {
    const root = document.documentElement;
    const saved = localStorage.getItem('groovequip-theme') || 'dark';
    const button = document.getElementById('themeToggle');
    function applyTheme(name) {
      root.setAttribute('data-theme', name);
      button.textContent = name === 'dark' ? 'Light mode' : 'Dark mode';
      localStorage.setItem('groovequip-theme', name);
    }
    applyTheme(saved);
    button.addEventListener('click', function () {
      applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  })();
</script>
<script src="js/app.js"></script></body></html>
